# Azure DevOps access may be unavailable. Prefer local → server sync:
#
#   yarn sync:live
#
# That rsyncs the tree and builds both Docker stacks on the host.
# The live host sits behind WireGuard — run sync from a machine with WG ON.

trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      echo "Use yarn sync:live instead of cloud CD when Azure push is unavailable."
    displayName: "Prefer rsync deploy (sync:live)"
