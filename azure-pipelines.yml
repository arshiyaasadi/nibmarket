# Club FE — Azure Pipelines stub
#
# Shipping is NOT this pipeline.
#
# Dig / nibdev:  yarn sync:dev only (no host poll of develop)
# Live:          git push novin main → mlm-cd.timer → server-cd.sh → remote-deploy.sh
#
# History / dig + live fallback (laptop + WireGuard):
#   yarn sync:dev   / yarn sync:live
# See docs/05-ops/release-history.md and docs/05-ops/deploy.md
#
# Keep trigger none so ADO does not double-build in the cloud.

trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      echo "No cloud build."
      echo "Live: push main to Azure Repos; mlm-cd.timer on nibmarket host."
      echo "Dig: yarn sync:dev only (WireGuard). Do not enable mlm-cd-dev.timer."
    displayName: "Point to live host git-poll CD + dig manual sync"
