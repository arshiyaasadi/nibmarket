# Club FE — Azure Pipelines stub
#
# Shipping is NOT this pipeline. Auto release path:
#   push branch to Azure Repos (remote `novin` / MLM_Front)
#     → host systemd timer polls git every ~2m
#     → develop  → scripts/server-cd-dev.sh → nibdev (club.nibdev.com)
#     → main     → scripts/server-cd.sh     → live  (club.nibmarket.com)
#
# History / fallback (laptop + WireGuard):
#   yarn sync:dev   / yarn sync:live
# See docs/05-ops/release-history.md and docs/05-ops/deploy.md
#
# Keep trigger none so ADO does not double-build in the cloud.

trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      echo "No cloud build. Push to Azure Repos; app hosts poll main/develop."
      echo "Fallback: yarn sync:dev | yarn sync:live (WireGuard)."
    displayName: "Point to host git-poll CD"
