# Production behind external nginx network (nibdev / historical deploy.sh target)
# Run: docker compose -p mlm -f docker-compose.yml up --build -d
# Container name MUST stay `mlm_front` — host nginx proxies to http://mlm_front:3000
# Zone: set APP_ENV in .env (development | production). Rebuild after changing it.
# Requires the external "nginx" network: docker network create nginx

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: production
  args:
    NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    APP_ENV: ${APP_ENV:-development}
    NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-${APP_ENV:-development}}
    GIT_SHA: ${GIT_SHA:-unknown}
    NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-unknown}
    BUILD_TIME: ${BUILD_TIME:-}

services:
  app:
    container_name: mlm_front
    build: *app-build
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - nginx

networks:
  nginx:
    name: "nginx"
    external: true
