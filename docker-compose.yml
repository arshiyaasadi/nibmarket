# Production behind external nginx network
# Run: docker compose up --build -d
# Zone: set APP_ENV in .env (development | production). Rebuild after changing it.
# Requires the external "nginx" network: docker network create nginx

x-app-build: &app-build
  context: .
  target: production
  args:
    APP_ENV: ${APP_ENV:-development}
    NEXT_PUBLIC_APP_ENV: ${APP_ENV:-development}

services:
  app:
    container_name: mlm_front
    build: *app-build
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - nginx

networks:
  nginx:
    name: "nginx"
    external: true
