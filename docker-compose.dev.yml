# Development: app in container with hot reload (source mounted as volume)
# Run: docker compose -f docker-compose.dev.yml up --build
# URL: http://localhost:3000
# Zone: dev target reads env at runtime — APP_ENV comes from .env (no rebuild needed).
# Requires the external "nginx" network: docker network create nginx

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    networks:
      - nginx

volumes:
  node_modules:
  next_cache:

networks:
  nginx:
    name: "nginx"
    external: true
