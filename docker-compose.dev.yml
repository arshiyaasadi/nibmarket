# Dev zone — nibdev (APP_ENV=development)
# Run: docker compose -p mlm-dev -f docker-compose.dev.yml --env-file .env up -d --build
# Host port: APP_PORT from .env (default 3000)
# Requires: docker network create nginx

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: production
  args:
    NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    APP_ENV: ${APP_ENV:-development}
    NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
    GIT_SHA: ${GIT_SHA:-unknown}
    NEXT_PUBLIC_GIT_SHA: ${NEXT_PUBLIC_GIT_SHA:-${GIT_SHA:-unknown}}
    BUILD_TIME: ${BUILD_TIME:-}

services:
  app:
    container_name: mlm_front_dev
    build: *app-build
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks:
      - nginx

networks:
  nginx:
    name: "nginx"
    external: true
