# Dev zone — nibdev (APP_ENV=development)
# Blue/green slots: active on host :3000, standby on 127.0.0.1:2999 (localhost only).
#
# Port specs are full publish strings, set by remote-deploy-dev.sh from .cd-state/slot-state:
#   BLUE_PORT_SPEC=3000:3000
#   GREEN_PORT_SPEC=127.0.0.1:2999:3000
#
# Requires: docker network create nginx

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: production
  args:
    NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    APP_ENV: ${APP_ENV:-development}
    NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
    GIT_SHA: ${GIT_SHA:-unknown}
    NEXT_PUBLIC_GIT_SHA: ${NEXT_PUBLIC_GIT_SHA:-${GIT_SHA:-unknown}}
    BUILD_TIME: ${BUILD_TIME:-}

services:
  app_blue:
    container_name: mlm_front_dev_blue
    image: mlm-dev-blue:local
    build: *app-build
    ports:
      - "${BLUE_PORT_SPEC:-3000:3000}"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks:
      - nginx

  app_green:
    container_name: mlm_front_dev_green
    image: mlm-dev-green:local
    build: *app-build
    ports:
      - "${GREEN_PORT_SPEC:-127.0.0.1:2999:3000}"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks:
      - nginx

networks:
  nginx:
    name: "nginx"
    external: true
