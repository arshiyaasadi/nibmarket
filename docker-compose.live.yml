# Live zone — club.nibmarket.ir (APP_ENV=production)
# Run: docker compose -p mlm-live -f docker-compose.live.yml --env-file .env.live up -d --build
# Host port: APP_PORT from .env.live (default 3002)
# Requires: docker network create nginx

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: production
  args:
    NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    APP_ENV: ${APP_ENV:-production}
    NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
    GIT_SHA: ${GIT_SHA:-unknown}
    NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-unknown}
    BUILD_TIME: ${BUILD_TIME:-}

services:
  app:
    container_name: mlm_front_live
    build: *app-build
    ports:
      - "${APP_PORT:-3002}:3000"
    env_file:
      - path: .env.live
        required: false
    restart: unless-stopped
    networks:
      - nginx

networks:
  nginx:
    name: "nginx"
    external: true
