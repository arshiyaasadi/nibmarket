# Live zone — club.nibmarket.com (APP_ENV=production)
# Run: docker compose -p mlm-live -f docker-compose.live.yml --env-file .env.live up -d --build
# Host port: APP_PORT from .env.live (default 3000 — same as dig)
# Requires: docker network create nginx

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: production
  args:
    NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    APP_ENV: ${APP_ENV:-production}
    NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
    # Bake SSO/invite public origin into the client bundle (CDN host, not club-docker:3000)
    NEXT_PUBLIC_PUBLIC_ORIGIN: ${NEXT_PUBLIC_PUBLIC_ORIGIN:-https://club.nibmarket.com}
    FORCE_UI_DEV_MODE: ${FORCE_UI_DEV_MODE:-}
    NEXT_PUBLIC_FORCE_UI_DEV_MODE: ${NEXT_PUBLIC_FORCE_UI_DEV_MODE:-}
    NEXT_PUBLIC_UI_DEV_MODE: ${NEXT_PUBLIC_UI_DEV_MODE:-}
    GIT_SHA: ${GIT_SHA:-unknown}
    NEXT_PUBLIC_GIT_SHA: ${NEXT_PUBLIC_GIT_SHA:-${GIT_SHA:-unknown}}
    BUILD_TIME: ${BUILD_TIME:-}

services:
  app:
    container_name: mlm_front_live
    build: *app-build
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env.live
        required: false
    restart: unless-stopped
    networks:
      - nginx

networks:
  nginx:
    name: "nginx"
    external: true
