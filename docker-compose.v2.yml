# V2 / UI stack on live host — mocks + auth bypass (FORCE_UI_DEV_MODE)
# Run: docker compose -p mlm-v2 -f docker-compose.v2.yml --env-file .env.v2 up -d --build
# Port: APP_PORT from .env.v2 (default 3003)
# Requires: docker network create nginx

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: production
  args:
    NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    APP_ENV: ${APP_ENV:-development}
    NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
    FORCE_UI_DEV_MODE: "1"
    NEXT_PUBLIC_FORCE_UI_DEV_MODE: "1"
    GIT_SHA: ${GIT_SHA:-unknown}
    NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-unknown}
    BUILD_TIME: ${BUILD_TIME:-}

services:
  app:
    container_name: mlm_front_v2
    build: *app-build
    ports:
      - "${APP_PORT:-3003}:3000"
    env_file:
      - path: .env.v2
        required: false
    environment:
      FORCE_UI_DEV_MODE: "1"
      NEXT_PUBLIC_FORCE_UI_DEV_MODE: "1"
      UI_DEV_MODE: "1"
      NEXT_PUBLIC_UI_DEV_MODE: "1"
      API_SERVICE_MODE: mock
    restart: unless-stopped
    networks:
      - nginx

networks:
  nginx:
    name: "nginx"
    external: true
