# club.nibmarket.ir — live Next.js (host port __LIVE_PORT__)
# Placeholders filled by scripts/remote-deploy.sh:
#   __DOMAIN__  __LIVE_PORT__

upstream mlm_front_live {
    server 127.0.0.1:__LIVE_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 25m;

    location / {
        proxy_pass http://mlm_front_live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location = /build-info.json {
        proxy_pass http://mlm_front_live;
        proxy_set_header Host $host;
    }
}
