# club.nibmarket.ir — production Next.js (host port __PROD_PORT__)
# Placeholders filled by scripts/remote-deploy.sh:
#   __DOMAIN__  __PROD_PORT__  __UI_PORT__
#
# UI stack stays on host :__UI_PORT__ (direct access / optional later subdomain).

upstream mlm_front_prod {
    server 127.0.0.1:__PROD_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 25m;

    location / {
        proxy_pass http://mlm_front_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Optional health peek without auth
    location = /build-info.json {
        proxy_pass http://mlm_front_prod;
        proxy_set_header Host $host;
    }
}
