# CDN origin (ArvanCloud) → this host :80 → Next.js :__LIVE_PORT__
# TLS terminates at the CDN. Do NOT add listen 443 / certbot / return 301 https
# here — that causes a redirect loop (CDN HTTPS → origin 301 → same HTTPS).
#
# Placeholders filled by scripts/remote-deploy.sh:
#   __DOMAIN__  __LIVE_PORT__  __UPSTREAM__  __EXTRA_SERVER_NAMES__

upstream __UPSTREAM__ {
    server 127.0.0.1:__LIVE_PORT__;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ __EXTRA_SERVER_NAMES__;

    client_max_body_size 25m;

    location / {
        proxy_pass http://__UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CDN terminates TLS; tell the app the public scheme is HTTPS
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location = /build-info.json {
        proxy_pass http://__UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
