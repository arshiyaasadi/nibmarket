# Alias for production — same as docker-compose.yml
# Run: docker compose -f docker-compose.prod.yml up --build -d

services:
  app:
    build:
      context: .
      target: production
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-bookworm-slim}
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
