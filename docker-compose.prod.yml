# Production stack on live host (nibmarket DNS via APP_ENV=production presets)
# Run: docker compose -p mlm-prod -f docker-compose.prod.yml up -d --build
# Port: APP_PORT from .env.production (default 3000)
# Requires: docker network create nginx

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: production
  args:
    NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-mirror.gcr.io/library/node:22-bookworm-slim}
    APP_ENV: ${APP_ENV:-production}
    NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
    GIT_SHA: ${GIT_SHA:-unknown}
    NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-unknown}
    BUILD_TIME: ${BUILD_TIME:-}

services:
  app:
    container_name: mlm_front_prod
    build: *app-build
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env.production
        required: false
    restart: unless-stopped
    networks:
      - nginx

networks:
  nginx:
    name: "nginx"
    external: true
