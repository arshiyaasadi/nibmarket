# Alias for production with host port mapping (used by deploy.sh)
# Run: docker compose -f docker-compose.prod.yml up --build -d
# Zone: set APP_ENV in .env (development | production). Rebuild after changing it.
# Requires the external "nginx" network: docker network create nginx

x-app-build: &app-build
  context: .
  target: production
  args:
    APP_ENV: ${APP_ENV:-development}
    NEXT_PUBLIC_APP_ENV: ${APP_ENV:-development}

services:
  app:
    build: *app-build
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - nginx

networks:
  nginx:
    name: "nginx"
    external: true
