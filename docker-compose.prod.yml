# Alias for production — same as docker-compose.yml
# Run: docker compose -f docker-compose.prod.yml up --build -d

services:
  app:
    build:
      context: .
      target: production
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-bookworm-slim}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_COMMIT_FULL: ${GIT_COMMIT_FULL:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
        APP_VERSION: ${APP_VERSION:-2.1.0}
        APP_ENV: production
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api-club.nibdev.com}
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-api}
        NEXT_PUBLIC_API_ENABLED: ${NEXT_PUBLIC_API_ENABLED:-}
        NEXT_PUBLIC_JWT_EXPIRATION: ${NEXT_PUBLIC_JWT_EXPIRATION:-5m}
        NEXT_PUBLIC_JWT_SECRET: ${NEXT_PUBLIC_JWT_SECRET:-dd5f3089-40c3-403d-af14-d0c228b05cb4}
        NEXT_PUBLIC_JWT_REFRESH_TOKEN_SECRET: ${NEXT_PUBLIC_JWT_REFRESH_TOKEN_SECRET:-7c4c1c50-3230-45bf-9eae-c9b2e401c767}
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    restart: unless-stopped
