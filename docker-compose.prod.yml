# Alias for production — same as docker-compose.yml
# Run: docker compose -f docker-compose.prod.yml up --build -d

services:
  app:
    build:
      context: .
      target: production
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Nib Club}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://api-club.nibdev.com}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://api-club.nibdev.com}
        NEXT_PUBLIC_SSO_CALLBACK_PATH: ${NEXT_PUBLIC_SSO_CALLBACK_PATH:-/login/sso}
        NEXT_PUBLIC_PANEL_BASE_URL: ${NEXT_PUBLIC_PANEL_BASE_URL:-https://panel.nibdev.com}
        NEXT_PUBLIC_SSO_ENTRY_COOKIE: ${NEXT_PUBLIC_SSO_ENTRY_COOKIE:-nib_auth}
        NEXT_PUBLIC_PANEL_PROFILE_URL: ${NEXT_PUBLIC_PANEL_PROFILE_URL:-https://panel.nibdev.com/profile/}
        NEXT_PUBLIC_PANEL_USER_ACCOUNT_URL: ${NEXT_PUBLIC_PANEL_USER_ACCOUNT_URL:-https://panel.nibdev.com/user-account/}
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    restart: unless-stopped
